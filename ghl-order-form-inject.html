.container-order-form-two-step .StripeElement,

.container-order-form-two-step .order-bump-container .main-section {

.container-order-form-two-step .order-bump-container .headline {

    color: #0a84ff !important;

<script>
// ============================================================
// Russian Text Translation for GHL Order Form
// ============================================================
(function() {
    const translations = {
        // Headers
        'Shipping & Your Info': 'Ваши данные',
        'Upgrade Your Order & Save!': 'Оформите заказ и сэкономьте!',
        'Shipping': 'Доставка',
        'Payment': 'Оплата',

        // Labels & placeholders
        'Full Name...': 'Полное имя...',
        'Email Address...': 'Email адрес...',
        'Phone Number...': 'Номер телефона...',
        'Full Address...': 'Полный адрес...',
        'City Name...': 'Город...',
        'State / Province...': 'Область/Регион...',
        'Zip Code...': 'Почтовый индекс...',

        // Table headers
        'Item': 'Товар',
        'Quantity': 'Кол-во',
        'Price': 'Цена',
        'Amount': 'Сумма',

        // Order summary
        'Order Summary': 'Итого заказа',
        'No products available': 'Нет доступных товаров',
        'Please select at least one item to proceed!': 'Выберите хотя бы один товар!',

        // Coupon
        'Enter Coupon Code': 'Введите промокод',
        'Apply': 'Применить',

        // Footer
        '* 100% Secure & Safe Payments *': '🔒 100% Безопасная оплата',

        // Button
        'PLACE MY ORDER': 'ОФОРМИТЬ ЗАКАЗ',
        'AND GET INSTANT ACCESS': 'ПОЛУЧИТЬ МГНОВЕННЫЙ ДОСТУП'
    };

    function translatePage() {
        const container = document.querySelector('.container-order-form-two-step');
        if (!container) return;

        // Walk through text nodes
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while (node = walker.nextNode()) {
            const text = node.textContent.trim();
            if (translations[text]) {
                node.textContent = node.textContent.replace(text, translations[text]);
            }
        }

        // Replace placeholders
        container.querySelectorAll('input[placeholder], textarea[placeholder]').forEach(el => {
            const placeholder = el.getAttribute('placeholder');
            if (translations[placeholder]) {
                el.setAttribute('placeholder', translations[placeholder]);
            }
        });

        // Replace button text
        const btn = container.querySelector('.form-btn');
        if (btn) {
            const mainText = btn.querySelector('.main-text');
            const subText = btn.querySelector('.sub-text');
            if (mainText && mainText.textContent.includes('PLACE')) {
                mainText.textContent = 'ОФОРМИТЬ ЗАКАЗ';
            }
            if (subText && subText.textContent.includes('INSTANT')) {
                subText.textContent = 'ПОЛУЧИТЬ МГНОВЕННЫЙ ДОСТУП';
            }
        }
    }

    // Run on load and observe for changes
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(translatePage, 300);
            setTimeout(translatePage, 1000);
            setTimeout(translatePage, 2500);
        });
    } else {
        setTimeout(translatePage, 300);
        setTimeout(translatePage, 1000);
        setTimeout(translatePage, 2500);
    }

    // Observe for dynamic content
    const observer = new MutationObserver(() => translatePage());
    observer.observe(document.body, { childList: true, subtree: true });
})();
</script>
