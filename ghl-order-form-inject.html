<script>
// ============================================================
// GHL ORDER FORM - Russian Text Replacement
// Only targets elements inside order form containers
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
    setTimeout(translateForm, 500);
    setTimeout(translateForm, 1500);
    setTimeout(translateForm, 3000);

    const observer = new MutationObserver(translateForm);
    observer.observe(document.body, { childList: true, subtree: true });
});

function translateForm() {
    // Find order form containers
    const formContainers = document.querySelectorAll('.order-form, .hl-order-form, [id*="order-form"], .container-order-form-two-step, [class*="order-form-container"]');

    if (formContainers.length === 0) return;

    const translations = {
        'Contact Information': 'Контактные данные',
        'Contact': 'Контакт',
        'Payment Information': 'Информация об оплате',
        'Payment Details': 'Данные оплаты',
        'Payment': 'Оплата',
        'Billing Address': 'Адрес для выставления счета',
        'Billing': 'Адрес',
        'Order Summary': 'Ваш заказ',
        'Your Order': 'Ваш заказ',
        'Summary': 'Итого',
        'First Name': 'Имя',
        'Last Name': 'Фамилия',
        'Full Name': 'Полное имя',
        'Name': 'Имя',
        'Email': 'Email',
        'Email Address': 'Email адрес',
        'Phone': 'Телефон',
        'Phone Number': 'Номер телефона',
        'Address': 'Адрес',
        'Address Line 1': 'Адрес (строка 1)',
        'Address Line 2': 'Адрес (строка 2)',
        'City': 'Город',
        'State': 'Область/Регион',
        'State/Province': 'Область/Регион',
        'Province': 'Область',
        'Country': 'Страна',
        'Postal Code': 'Почтовый индекс',
        'Zip Code': 'Почтовый индекс',
        'ZIP': 'Индекс',
        'Card Number': 'Номер карты',
        'Card number': 'Номер карты',
        'Expiration': 'Срок действия',
        'Expiration Date': 'Срок действия',
        'Expiry': 'Срок',
        'MM/YY': 'ММ/ГГ',
        'CVC': 'CVC',
        'CVV': 'CVV',
        'Security Code': 'Код безопасности',
        'Submit': 'Отправить',
        'Submit Order': 'Оформить заказ',
        'Place Order': 'Оформить заказ',
        'Complete Order': 'Завершить заказ',
        'Complete Purchase': 'Завершить покупку',
        'Pay Now': 'Оплатить',
        'Buy Now': 'Купить сейчас',
        'Checkout': 'Оформить',
        'Continue': 'Продолжить',
        'Next': 'Далее',
        'Back': 'Назад',
        'Coupon': 'Промокод',
        'Coupon Code': 'Промокод',
        'Promo Code': 'Промокод',
        'Discount Code': 'Код скидки',
        'Apply': 'Применить',
        'Apply Coupon': 'Применить промокод',
        'Remove': 'Удалить',
        'Subtotal': 'Подытог',
        'Total': 'Итого',
        'Tax': 'Налог',
        'Discount': 'Скидка',
        'Shipping': 'Доставка',
        'Free': 'Бесплатно',
        'Required': 'Обязательно',
        'Required field': 'Обязательное поле',
        'This field is required': 'Это поле обязательно',
        'Invalid email': 'Неверный email',
        'Invalid email address': 'Неверный email адрес',
        'Invalid card number': 'Неверный номер карты',
        'Invalid expiration date': 'Неверный срок действия',
        'Invalid CVC': 'Неверный CVC',
        'Processing...': 'Обработка...',
        'Please wait...': 'Подождите...',
        'Payment successful': 'Оплата прошла успешно',
        'Payment failed': 'Ошибка оплаты',
        'Try again': 'Попробуйте снова',
        'or': 'или',
        'and': 'и',
        'Yes': 'Да',
        'No': 'Нет',
        'Select': 'Выбрать',
        'Select...': 'Выберите...',
        'Choose': 'Выбрать',
        'Optional': 'Необязательно',
        '(optional)': '(необязательно)',
        'Secure checkout': 'Безопасная оплата',
        'Your information is secure': 'Ваши данные защищены',
        '100% Secure': '100% Безопасно',
        'Money-back guarantee': 'Гарантия возврата денег',
        'Enter your email': 'Введите ваш email',
        'Enter your name': 'Введите ваше имя',
        'Enter your phone': 'Введите ваш телефон',
        'Enter coupon code': 'Введите промокод',
        'Your email address': 'Ваш email адрес'
    };

    formContainers.forEach(container => {
        // Replace text nodes
        const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while (node = walker.nextNode()) {
            let text = node.textContent.trim();
            if (translations[text]) {
                node.textContent = node.textContent.replace(text, translations[text]);
            }
        }

        // Replace placeholders
        container.querySelectorAll('input, textarea').forEach(input => {
            const placeholder = input.getAttribute('placeholder');
            if (placeholder && translations[placeholder]) {
                input.setAttribute('placeholder', translations[placeholder]);
            }
        });

        // Replace button text
        container.querySelectorAll('button, input[type="submit"], .form-btn, .submit-btn').forEach(btn => {
            const text = btn.textContent.trim();
            if (translations[text]) {
                btn.textContent = translations[text];
            }
            const value = btn.getAttribute('value');
            if (value && translations[value]) {
                btn.setAttribute('value', translations[value]);
            }
        });

        // Replace labels
        container.querySelectorAll('label, .form-label, .input-label').forEach(label => {
            const text = label.textContent.trim();
            const cleanText = text.replace(/\s*\*\s*$/, '');
            if (translations[cleanText]) {
                label.innerHTML = label.innerHTML.replace(cleanText, translations[cleanText]);
            }
        });
    });
}
</script>
